name: Deploy documentation preview to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'yuxiqian/flink-cdc'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '11'
          cache: maven
      - name: Set up Maven 3.9.16
        run: |
          archive="$RUNNER_TEMP/apache-maven-3.9.16-bin.tar.gz"
          url="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz"
          curl --fail --silent --show-error --location "$url" --output "$archive"
          checksum=$(curl --fail --silent --show-error --location "$url.sha512")
          python3 -c 'import hashlib, pathlib, sys; assert hashlib.sha512(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() == sys.argv[2]' "$archive" "$checksum"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build documentation and Javadoc
        env:
          DOCS_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          DOCS_URL: ${{ steps.pages.outputs.origin }}
        run: bash .github/workflows/docs.sh
      - name: Verify Javadoc output
        run: |
          test -s docs/target/api/java/index.html
          test -s docs/target/api/java/org/apache/flink/cdc/common/event/DataChangeEvent.html
          test -s docs/target/api/java/org/apache/flink/cdc/connectors/mysql/source/MySqlSource.html
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/target

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
